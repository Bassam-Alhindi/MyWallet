<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040405"/>
      <stop offset="55%" stop-color="#0a2318"/>
      <stop offset="100%" stop-color="#0d3b26"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;1500" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1700" dur="3.4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }

    .frame {
      fill: none;
      stroke: url(#titleGrad);
      stroke-width: 1.5;
      rx: 18;
      opacity: 0.35;
      animation: framePulse 4s ease-in-out infinite;
    }
    @keyframes framePulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.55; }
    }

    .blob { mix-blend-mode: screen; filter: url(#blobBlur); }
    .blob1 { fill: #1DB954; opacity: 0.35; animation: drift1 16s ease-in-out infinite alternate; }
    .blob2 { fill: #ffd700; opacity: 0.22; animation: drift2 21s ease-in-out infinite alternate; }
    .blob3 { fill: #2fd3c6; opacity: 0.20; animation: drift3 13s ease-in-out infinite alternate; }
    @keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(120px,-30px); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-100px,25px); } }
    @keyframes drift3 { 0% { transform: translate(0,0); } 100% { transform: translate(60px,40px); } }

    .chartline {
      fill: none;
      stroke: url(#chartGrad);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softGlow);
      opacity: 0.55;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: drawChart 5s ease-in-out infinite;
    }
    @keyframes drawChart {
      0%   { stroke-dashoffset: 1400; opacity: 0; }
      12%  { opacity: 0.55; }
      55%  { stroke-dashoffset: 0; opacity: 0.55; }
      85%  { opacity: 0.55; }
      100% { stroke-dashoffset: -1400; opacity: 0; }
    }
    .chartdot {
      fill: #ffe57f;
      filter: url(#glow);
      animation: dotPulse 5s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 50% { opacity: 0; transform: scale(0.6); }
      60% { opacity: 1; transform: scale(1.3); }
      75%, 100% { opacity: 0; transform: scale(0.8); }
    }

    .spark { fill: #fff8dc; opacity: 0; animation: twinkle 2.6s ease-in-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: .5s; } .s3 { animation-delay: 1.1s; }
    .s4 { animation-delay: 1.6s; } .s5 { animation-delay: .3s; } .s6 { animation-delay: 2s; }
    .s7 { animation-delay: .9s; } .s8 { animation-delay: 1.4s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .coin { fill: url(#coinGrad); opacity: 0; animation: floatUp 6s ease-in infinite; }
    .coin1 { animation-delay: 0s; } .coin2 { animation-delay: .8s; } .coin3 { animation-delay: 1.6s; }
    .coin4 { animation-delay: 2.4s; } .coin5 { animation-delay: 3.2s; } .coin6 { animation-delay: 4s; }
    .coin7 { animation-delay: 4.8s; } .coin8 { animation-delay: 5.4s; }
    @keyframes floatUp {
      0%   { transform: translateY(0px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(-260px) rotate(25deg); opacity: 0; }
    }

    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: url(#titleGrad);
      filter: url(#glow);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .shine {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: url(#shineGrad);
      mix-blend-mode: overlay;
    }

    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      fill: #d9f7e3;
    }

    .shimmer {
      stroke: url(#titleGrad);
      stroke-width: 3;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 3s ease-in-out infinite alternate;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .badge {
      animation: badgePulse 2.4s ease-in-out infinite;
      transform-origin: 1060px 60px;
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <circle class="blob blob1" cx="180" cy="90" r="130"/>
  <circle class="blob blob2" cx="1020" cy="70" r="150"/>
  <circle class="blob blob3" cx="620" cy="260" r="120"/>

  <polyline class="chartline" points="0,255 110,225 210,240 330,180 450,200 570,140 690,165 810,100 930,125 1050,55 1180,35"/>
  <circle class="chartdot" cx="1180" cy="35" r="7"/>

  <g class="spark">
    <circle class="s1" cx="90"   cy="55"  r="2.2"/>
    <circle class="s2" cx="1120" cy="230" r="2"/>
    <circle class="s3" cx="1150" cy="150" r="2.4"/>
    <circle class="s4" cx="60"   cy="200" r="2"/>
    <circle class="s5" cx="260"  cy="45"  r="1.8"/>
    <circle class="s6" cx="940"  cy="40"  r="2.2"/>
    <circle class="s7" cx="1040" cy="200" r="1.8"/>
    <circle class="s8" cx="200"  cy="260" r="2"/>
  </g>

  <circle class="coin coin1" cx="120" cy="260" r="10"/>
  <circle class="coin coin2" cx="300" cy="270" r="7"/>
  <circle class="coin coin3" cx="500" cy="250" r="9"/>
  <circle class="coin coin4" cx="750" cy="265" r="8"/>
  <circle class="coin coin5" cx="950" cy="255" r="6"/>
  <circle class="coin coin6" cx="1100" cy="270" r="10"/>
  <circle class="coin coin7" cx="420" cy="275" r="6"/>
  <circle class="coin coin8" cx="870" cy="260" r="8"/>

  <text x="600" y="150" text-anchor="middle" class="title">💰 MyWallet</text>
  <text x="600" y="150" text-anchor="middle" class="shine">💰 MyWallet</text>
  <text x="600" y="195" text-anchor="middle" class="subtitle">AI-Powered Personal Finance, Reimagined</text>

  <line class="shimmer" x1="150" y1="230" x2="1050" y2="230"/>

  <g class="badge">
    <rect x="985" y="42" width="150" height="34" rx="17" fill="rgba(29,185,84,0.15)" stroke="#1DB954" stroke-width="1.2" filter="url(#softGlow)"/>
    <text x="1060" y="65" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#eafff1">🤖 AI Assistant</text>
  </g>

  <rect class="frame" x="6" y="6" width="1188" height="288" rx="18" filter="url(#softGlow)"/>
</svg>
