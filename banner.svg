<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0d3b26"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .coin {
      fill: url(#coinGrad);
      opacity: 0;
      animation: floatUp 6s ease-in infinite;
    }
    .coin1 { animation-delay: 0s; }
    .coin2 { animation-delay: 1s; }
    .coin3 { animation-delay: 2s; }
    .coin4 { animation-delay: 3s; }
    .coin5 { animation-delay: 4s; }
    .coin6 { animation-delay: 5s; }
    @keyframes floatUp {
      0%   { transform: translateY(0px); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-260px); opacity: 0; }
    }
    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: url(#titleGrad);
      filter: url(#glow);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      fill: #d9f7e3;
      opacity: 0;
      animation: fadeIn 2s ease-out 0.5s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .shimmer {
      stroke: url(#titleGrad);
      stroke-width: 3;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 3s ease-in-out infinite alternate;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <circle class="coin coin1" cx="120" cy="260" r="10"/>
  <circle class="coin coin2" cx="300" cy="270" r="7"/>
  <circle class="coin coin3" cx="500" cy="250" r="9"/>
  <circle class="coin coin4" cx="750" cy="265" r="8"/>
  <circle class="coin coin5" cx="950" cy="255" r="6"/>
  <circle class="coin coin6" cx="1100" cy="270" r="10"/>

  <text x="600" y="150" text-anchor="middle" class="title">💰 MyWallet</text>
  <text x="600" y="195" text-anchor="middle" class="subtitle">AI-Powered Personal Finance, Reimagined</text>

  <line class="shimmer" x1="150" y1="230" x2="1050" y2="230"/>
</svg>
