<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020103"/>
      <stop offset="55%" stop-color="#0b0716"/>
      <stop offset="100%" stop-color="#150c28"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9e4f5"/>
      <stop offset="50%" stop-color="#9d8bd9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6bb5"/>
      <stop offset="100%" stop-color="#9d8bd9"/>
    </linearGradient>
    <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8c9fb"/>
      <stop offset="100%" stop-color="#6d4fa8"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }

    .frame {
      fill: none;
      stroke: url(#titleGrad);
      stroke-width: 1.2;
      rx: 18;
      opacity: 0.22;
    }

    .blob { mix-blend-mode: screen; filter: url(#blobBlur); }
    .blob1 { fill: #5b4b8a; opacity: 0.18; animation: drift1 28s ease-in-out infinite alternate; }
    .blob2 { fill: #3d2d63; opacity: 0.16; animation: drift2 34s ease-in-out infinite alternate; }
    @keyframes drift1 { 0% { transform: translate(0,0); } 100% { transform: translate(60px,-20px); } }
    @keyframes drift2 { 0% { transform: translate(0,0); } 100% { transform: translate(-50px,15px); } }

    .chartline {
      fill: none;
      stroke: url(#chartGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#softGlow);
      opacity: 0;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: drawChart 3.5s ease-out 0.3s forwards;
    }
    @keyframes drawChart {
      0%   { stroke-dashoffset: 1400; opacity: 0; }
      15%  { opacity: 0.28; }
      100% { stroke-dashoffset: 0; opacity: 0.28; }
    }
    .chartdot {
      fill: #d8c9fb;
      filter: url(#softGlow);
      opacity: 0;
      animation: dotFade 8s ease-in-out 3.6s infinite;
    }
    @keyframes dotFade {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }

    .spark { fill: #ece7fb; opacity: 0; animation: twinkle 4.5s ease-in-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 2.2s; } .s4 { animation-delay: 3.1s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.65; transform: scale(1); }
    }

    .coin { fill: url(#coinGrad); opacity: 0; animation: floatUp 10s ease-in-out infinite; }
    .coin1 { animation-delay: 0s; }
    .coin2 { animation-delay: 2.5s; }
    .coin3 { animation-delay: 5s; }
    .coin4 { animation-delay: 7.5s; }
    @keyframes floatUp {
      0%   { transform: translateY(0px); opacity: 0; }
      15%  { opacity: 0.45; }
      85%  { opacity: 0.18; }
      100% { transform: translateY(-220px); opacity: 0; }
    }

    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 72px;
      font-weight: 800;
      fill: url(#titleGrad);
      filter: url(#glow);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      fill: #cbc2e8;
    }

    .shimmer {
      stroke: url(#titleGrad);
      stroke-width: 2;
      opacity: 0.5;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: draw 2.5s ease-out 0.6s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <circle class="blob blob1" cx="220" cy="90" r="140"/>
  <circle class="blob blob2" cx="980" cy="220" r="150"/>

  <polyline class="chartline" points="0,255 110,225 210,240 330,180 450,200 570,140 690,165 810,100 930,125 1050,55 1180,35"/>
  <circle class="chartdot" cx="1180" cy="35" r="6"/>

  <g class="spark">
    <circle class="s1" cx="90"   cy="55"  r="2"/>
    <circle class="s2" cx="1120" cy="230" r="1.8"/>
    <circle class="s3" cx="1150" cy="150" r="2.2"/>
    <circle class="s4" cx="60"   cy="200" r="1.8"/>
  </g>

  <circle class="coin coin1" cx="150" cy="260" r="9"/>
  <circle class="coin coin2" cx="480" cy="265" r="7"/>
  <circle class="coin coin3" cx="820" cy="258" r="8"/>
  <circle class="coin coin4" cx="1080" cy="268" r="6"/>

  <text x="600" y="150" text-anchor="middle" class="title">💰 MyWallet</text>
  <text x="600" y="195" text-anchor="middle" class="subtitle">AI-Powered Personal Finance, Reimagined</text>

  <line class="shimmer" x1="150" y1="230" x2="1050" y2="230"/>

  <rect class="frame" x="6" y="6" width="1188" height="288" rx="18"/>
</svg>
